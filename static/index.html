<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОКК Аналитика</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--good:#16a34a;--mid:#d97706;--bad:#dc2626;--chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#171a21;--text:#e6e8eb;--muted:#9aa3ae;--line:#272b34;
  --accent:#60a5fa;--good:#4ade80;--mid:#fbbf24;--bad:#f87171;--chip:#1e2433;}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
main .wrap{padding-top:20px;padding-bottom:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.card h2{margin:0 0 12px;font-size:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.score{font-weight:700}
.s-good{color:var(--good)}.s-mid{color:var(--mid)}.s-bad{color:var(--bad)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent)}
.table-scroll{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:30px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);max-width:760px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dlg-body{padding:16px 18px}
.dlg-body h3{font-size:14px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px}
.err{border-left:3px solid var(--bad);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0}
.err q{font-style:italic}
audio{width:100%;margin-top:6px}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>📋 ОКК Аналитика</h1><div class="sub">Қоңыраулар сапасының аудиті — Sipuni + Gemini</div></div>
  <div><button id="refresh" class="primary">↻ Жаңарту</button></div>
</div></header>

<main><div class="wrap">
  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>👥 Менеджерлер рейтингі</h2>
    <div class="table-scroll"><table>
      <thead><tr><th>Менеджер</th><th class="num">Қоңырау</th><th class="num">Орташа балл</th><th></th><th class="num">Критикалық</th><th class="num">Ыстық лидтер (A)</th></tr></thead>
      <tbody id="managers"></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>📞 Қоңыраулар</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="Іздеу: менеджер, клиент, нөмір…">
      <select id="fManager"><option value="">Барлық менеджерлер</option></select>
      <select id="fLead"><option value="">Барлық лидтер</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
      <select id="fPeriod"><option value="">Барлық уақыт</option><option value="1">Бүгін</option><option value="7">7 күн</option><option value="30">30 күн</option></select>
      <label style="display:flex;align-items:center;gap:6px"><input id="fCrit" type="checkbox"> Тек критикалық</label>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th>Уақыт</th><th>Менеджер</th><th>Клиент</th><th class="num">Ұзақтығы</th><th class="num">Балл</th><th>Лид</th><th>Нәтиже</th></tr></thead>
      <tbody id="calls"></tbody>
    </table></div>
  </section>
</div></main>

<dialog id="dlg"><div class="dlg-head"><b id="dlgTitle">Аудит</b><button onclick="dlg.close()">✕</button></div><div class="dlg-body" id="dlgBody"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls = n => n == null ? "" : n >= 75 ? "s-good" : n >= 50 ? "s-mid" : "s-bad";
const fmtDur = s => { s = +s || 0; return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const fmtDate = d => new Date(d).toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const leadLetter = c => (String(c||"").trim()[0] || "").toUpperCase();
const mgrKey = a => { const n = a.result.manager_name; return (n && n !== "Аталмады" ? n : "") + (a.manager_num && a.manager_num !== "Белгісіз" ? ` (${a.manager_num})` : "") || "Белгісіз"; };

let audits = [];

async function load(){
  try{
    const r = await fetch("/api/audits?limit=2000");
    if(!r.ok) throw new Error(r.status);
    audits = await r.json();
  }catch(e){ audits = []; }
  fillManagerFilter(); render();
}

function filtered(){
  const q = $("#q").value.trim().toLowerCase(), m = $("#fManager").value, l = $("#fLead").value,
        p = +$("#fPeriod").value, crit = $("#fCrit").checked;
  const since = p ? (p === 1 ? new Date(new Date().setHours(0,0,0,0)) : new Date(Date.now() - p*864e5)) : null;
  return audits.filter(a => {
    if(m && mgrKey(a) !== m) return false;
    if(l && leadLetter(a.lead_category) !== l) return false;
    if(crit && !a.critical) return false;
    if(since && new Date(a.created_at) < since) return false;
    if(q){
      const hay = [mgrKey(a), a.result.client_name, a.client_num, a.result.call_summary, a.result.call_outcome].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function fillManagerFilter(){
  const sel = $("#fManager"), cur = sel.value;
  const names = [...new Set(audits.map(mgrKey))].sort();
  sel.innerHTML = `<option value="">Барлық менеджерлер</option>` + names.map(n => `<option>${esc(n)}</option>`).join("");
  sel.value = names.includes(cur) ? cur : "";
}

function render(){
  const list = filtered();
  const scored = list.filter(a => a.manager_score != null);
  const avg = scored.length ? Math.round(scored.reduce((s,a)=>s+a.manager_score,0)/scored.length) : null;
  const hot = list.filter(a => leadLetter(a.lead_category) === "A").length;
  const crit = list.filter(a => a.critical).length;
  const totalMin = Math.round(list.reduce((s,a)=>s+(+a.duration||0),0)/60);
  $("#kpis").innerHTML = [
    ["Аудит саны", list.length, ""],
    ["Орташа балл", avg ?? "—", cls(avg)],
    ["Ыстық лидтер (A)", hot, ""],
    ["Критикалық қателер", crit, crit ? "s-bad" : ""],
    ["Жалпы уақыт", totalMin + " мин", ""],
  ].map(([l,v,c]) => `<div class="kpi"><div class="v ${c}">${esc(v)}</div><div class="l">${l}</div></div>`).join("");

  // менеджерлер
  const by = {};
  list.forEach(a => { const k = mgrKey(a); (by[k] ||= []).push(a); });
  const rows = Object.entries(by).map(([k, arr]) => {
    const sc = arr.filter(a=>a.manager_score!=null);
    return {k, n:arr.length, avg: sc.length ? Math.round(sc.reduce((s,a)=>s+a.manager_score,0)/sc.length) : null,
            crit: arr.filter(a=>a.critical).length, hot: arr.filter(a=>leadLetter(a.lead_category)==="A").length};
  }).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  $("#managers").innerHTML = rows.length ? rows.map(r => `<tr data-m="${esc(r.k)}">
    <td>${esc(r.k)}</td><td class="num">${r.n}</td>
    <td class="num score ${cls(r.avg)}">${r.avg ?? "—"}</td>
    <td><div class="bar"><i style="width:${r.avg||0}%"></i></div></td>
    <td class="num ${r.crit?"s-bad":""}">${r.crit}</td><td class="num">${r.hot}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">Әзірге дерек жоқ</td></tr>`;

  $("#calls").innerHTML = list.length ? list.map(a => `<tr data-id="${esc(a.call_id)}">
    <td style="white-space:nowrap">${fmtDate(a.created_at)}</td>
    <td>${esc(mgrKey(a))}</td>
    <td>${esc(a.result.client_name && a.result.client_name!=="Аталмады" ? a.result.client_name : "")}<div class="sub">${esc(a.client_num)}</div></td>
    <td class="num">${fmtDur(a.duration)}</td>
    <td class="num score ${cls(a.manager_score)}">${a.manager_score ?? "—"}${a.critical?" ⚠️":""}</td>
    <td><span class="chip">${esc(a.lead_category || "—")}</span></td>
    <td>${esc(a.result.call_outcome || "")}</td></tr>`).join("")
    : `<tr><td colspan="7" class="empty">Қоңыраулар табылмады. Sipuni вебхугы келгенде мұнда пайда болады.</td></tr>`;
}

const SCORE_NAMES = {contact:"Контакт",dialog_control:"Диалогты басқару",need_discovery:"Қажеттілікті анықтау",qualification_bant:"BANT",presentation:"Презентация",objections:"Қарсылықтармен жұмыс",closing_next_step:"Жабу / келесі қадам",speech_tone:"Сөйлеу тоны"};

function openAudit(id){
  const a = audits.find(x => x.call_id === id); if(!a) return;
  const r = a.result, m = r.manager_assessment || {}, l = r.lead_assessment || {}, t = r.talk_ratio || {}, s = m.scores || {};
  $("#dlgTitle").textContent = `Аудит · ${fmtDate(a.created_at)} · ${fmtDur(a.duration)}`;
  $("#dlgBody").innerHTML = `
    <div class="grid2">
      <div>👤 <b>Менеджер:</b> ${esc(mgrKey(a))}</div>
      <div>📱 <b>Клиент:</b> ${esc(r.client_name)} ${esc(a.client_num)}</div>
      <div>🗣 <b>Talk ratio:</b> ${esc(t.manager_percent ?? 0)}% / ${esc(t.client_percent ?? 0)}%</div>
      <div>🔥 <b>Лид:</b> ${esc(l.category)} (${esc(l.total_score ?? "—")} балл)</div>
    </div>
    ${a.record_url ? `<audio controls preload="none" src="${esc(a.record_url)}"></audio>` : ""}
    <h3>Саммари</h3><p>${esc(r.call_summary)}</p>
    <h3>Нәтиже</h3><p><b>${esc(r.call_outcome)}</b></p>
    <h3>Менеджер бағасы: <span class="${cls(m.total_score)}">${esc(m.total_score ?? "—")}/100</span></h3>
    <p class="sub">${esc(m.grade)}</p>
    ${Object.entries(SCORE_NAMES).map(([k,n]) => `<div style="display:flex;gap:10px;align-items:center;margin:4px 0">
      <span style="flex:0 0 190px">${n}</span><div class="bar" style="flex:1"><i style="width:${(+s[k]||0)*10}%"></i></div>
      <span class="num" style="flex:0 0 40px">${esc(s[k] ?? "—")}/10</span></div>`).join("")}
    <p>🔻 <b>Штрафтар:</b> ${esc((m.penalties_applied||[]).join(", ") || "Жоқ")} · <b>Критикалық:</b> ${m.critical_violation ? '<span class="s-bad">ИӘ</span>' : "Жоқ"}</p>
    <h3>Қателіктер</h3>
    ${(m.critical_errors||[]).map((e,i) => `<div class="err"><b>${i+1}. ${esc(e.error_name)}</b><br>
      💬 <q>${esc(e.quote)}</q><br>❌ ${esc(e.why_bad)}<br>✅ ${esc(e.how_to_fix)}</div>`).join("") || "<p>Өрескел қателер табылмады.</p>"}
    <h3>Лид мінездемесі</h3><p>${esc(l.summary)}</p>
    <h3>💡 РОП скрипті</h3><p>«${esc(m.recommendation_script)}»</p>`;
  $("#dlg").showModal();
}

$("#calls").addEventListener("click", e => { const tr = e.target.closest("tr[data-id]"); if(tr) openAudit(tr.dataset.id); });
$("#managers").addEventListener("click", e => { const tr = e.target.closest("tr[data-m]"); if(tr){ $("#fManager").value = tr.dataset.m; render(); $("#calls").scrollIntoView({behavior:"smooth"}); }});
["#q","#fManager","#fLead","#fPeriod","#fCrit"].forEach(s => $(s).addEventListener("input", render));
$("#refresh").addEventListener("click", load);
load(); setInterval(load, 60000);
</script>
</body>
</html>
